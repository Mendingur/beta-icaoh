<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Khúc Ca Hy Vọng — Hành Trình Người Gieo Hạt</title>
<meta name="description" content="Event tương tác lấy cảm hứng từ Quyển I: Khúc Ca Hy Vọng — The Sower's Cycle.">
<style>
:root{
  --ink-0:#07070a;
  --ink-1:#0d0d13;
  --ink-2:#14141d;
  --ink-3:#1c1c28;
  --line:rgba(212,175,110,.16);
  --line-strong:rgba(212,175,110,.34);
  --gold-0:#f6e2ad;
  --gold-1:#e8c576;
  --gold-2:#c9973f;
  --amber:#ff9d4d;
  --ember:#ff6a3d;
  --violet:#8b6bd6;
  --teal:#4fd6c4;
  --paper:#efe6d3;
  --paper-dim:rgba(239,230,211,.62);
  --danger:#ff5c5c;
  --ok:#8fe3a6;
  --font-display:'Cormorant Garamond','Songti SC',serif;
  --font-vn:'Be Vietnam Pro','Inter',system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink-0);
  color:var(--paper);
  font-family:var(--font-vn);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
::selection{background:rgba(232,197,118,.3)}

/* ============ shared atoms ============ */
.btn{
  font-size:14px;font-weight:600;letter-spacing:.02em;
  padding:13px 24px;min-height:48px;
  border-radius:999px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.03);color:var(--paper);
  cursor:pointer;transition:transform .15s, background .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.95)}
.btn-primary{
  background:linear-gradient(180deg, var(--gold-0), var(--gold-2));
  color:#241705;border:none;
  box-shadow:0 8px 24px -6px rgba(201,151,63,.55);
}
.btn-primary:disabled{opacity:.4;filter:grayscale(.4);box-shadow:none}
.btn-ghost{background:transparent}

.icon-btn{
  width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line-strong);background:rgba(20,20,29,.85);
  color:var(--gold-1);display:grid;place-items:center;font-size:16px;cursor:pointer;
}
.icon-btn:active{transform:scale(.92)}

.toast{
  position:fixed;top:calc(var(--safe-top) + 14px);left:50%;transform:translate(-50%,-14px);
  z-index:200;background:rgba(14,14,20,.95);border:1px solid var(--line-strong);
  color:var(--gold-0);padding:11px 20px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .35s, transform .35s;
  box-shadow:0 20px 50px -12px rgba(0,0,0,.7);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,92,92,.5);color:#ffb3b3}
.toast.ok{border-color:rgba(143,227,166,.5);color:var(--ok)}

/* ============ screens ============ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s ease}
.screen.active{opacity:1;pointer-events:auto}

/* ============ modal ============ */
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(4,4,6,.82);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s;padding:20px}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{
  width:min(92vw,480px);max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(165deg, rgba(24,22,30,.98), rgba(11,10,15,.99));
  border:1px solid var(--line-strong);border-radius:22px;padding:30px 26px 26px;
  text-align:center;box-shadow:0 40px 100px -20px rgba(0,0,0,.85);
  transform:translateY(16px) scale(.97);transition:transform .45s cubic-bezier(.2,.9,.25,1);
  position:relative;
}
.modal.show .modal-card{transform:translateY(0) scale(1)}
.modal-kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-2);margin-bottom:10px}
.modal-title{font-family:var(--font-display);font-size:27px;color:var(--gold-0);margin:0 0 12px;line-height:1.25}
.modal-text{font-size:14px;line-height:1.7;color:var(--paper-dim);margin:0 0 20px;white-space:pre-line;text-align:left}
.modal-actions{display:flex;flex-direction:column;gap:10px}
.modal-actions .btn{width:100%}

.stars-row{display:flex;justify-content:center;gap:8px;margin:14px 0}
.star-slot{width:32px;height:32px}
.star-slot svg{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(232,197,118,.5))}

/* ============ dialogue ============ */
.dialogue{position:fixed;left:0;right:0;bottom:0;z-index:150;display:flex;justify-content:center;padding:0 14px calc(var(--safe-bottom) + 16px);pointer-events:none}
.dialogue-card{
  pointer-events:auto;width:min(94vw,600px);
  background:linear-gradient(180deg, rgba(18,18,26,.95), rgba(9,9,14,.98));
  border:1px solid var(--line-strong);border-radius:20px;padding:18px 20px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.75);
  opacity:0;transform:translateY(20px);transition:opacity .4s, transform .4s;
}
.dialogue-card.show{opacity:1;transform:translateY(0)}
.dialogue-speaker{font-family:var(--font-display);font-size:15px;color:var(--gold-1);display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dialogue-speaker .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.dialogue-text{font-size:14.5px;line-height:1.6;color:var(--paper-dim)}
.dialogue-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(232,197,118,.3);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <div id="toast" class="toast"></div>
  <div id="screens"></div>
  <div class="dialogue" id="dialogueWrap">
    <div class="dialogue-card" id="dialogueCard">
      <div class="dialogue-speaker"><span class="dot"></span><span id="dSpeakerName">Mai</span></div>
      <div class="dialogue-text" id="dText"></div>
      <div class="dialogue-actions" id="dActions"></div>
    </div>
  </div>
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-kicker" id="modalKicker">KHÚC CA HY VỌNG</div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-text" id="modalText"></div>
      <div class="stars-row" id="modalStars" style="display:none"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
